<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoMobi — Sign Up</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lato:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <img src="assets/logo.png" alt="GoMobi" class="logo-mark" />
      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Get started with GoMobi</p>

      <form class="auth-form" id="form-signup">
        <div class="field">
          <label for="nome">Name</label>
          <input type="text" id="nome" placeholder="Anika Bergström" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="anika@example.com" />
        </div>
        <div class="field">
          <label for="senha">Password</label>
          <input type="password" id="senha" placeholder="At least 8 characters" />
        </div>
        <div class="field">
          <label for="confirmar-senha">Confirm Password</label>
          <input type="password" id="confirmar-senha" placeholder="Re-enter password" />
        </div>

        <p class="form-error" id="mensagem-erro" style="display: none;"></p>

        <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </p>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    if (getUsuarioLogado()) {
      window.location.href = 'dashboard.html';
    }

    const form = document.getElementById('form-signup');
    const mensagemErro = document.getElementById('mensagem-erro');

    form.addEventListener('submit', function (e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmar-senha').value;

      mensagemErro.style.display = 'none';

      // Validação básica dos campos antes de tentar cadastrar
      if (!nome || !email || !senha || !confirmarSenha) {
        mensagemErro.textContent = 'Preencha todos os campos.';
        mensagemErro.style.display = 'block';
        return;
      }
      if (senha.length < 8) {
        mensagemErro.textContent = 'A senha precisa ter pelo menos 8 caracteres.';
        mensagemErro.style.display = 'block';
        return;
      }
      if (senha !== confirmarSenha) {
        mensagemErro.textContent = 'As senhas não são iguais.';
        mensagemErro.style.display = 'block';
        return;
      }

      const erro = fazerCadastro(nome, email, senha);
      if (erro) {
        mensagemErro.textContent = erro;
        mensagemErro.style.display = 'block';
      } else {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
